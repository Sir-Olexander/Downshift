[project]
name = "downshift"
version = "0.1.0"
description = "Thin tracing SDK: records your agent's model calls, tool calls and answers, and loads a versioned harness config."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "openai>=1.50",
  "httpx>=0.27",
  "pyyaml>=6",
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["downshift"]
