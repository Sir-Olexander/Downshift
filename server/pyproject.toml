[project]
name = "downshift-server"
version = "0.1.0"
description = "Downshift backend: run storage, optimizer, replay, scoring and GitHub PRs."
requires-python = ">=3.11"
dependencies = [
  "downshift",
  "downshift-demo-agent",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pyyaml>=6",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
downshift = { workspace = true }
downshift-demo-agent = { workspace = true }
