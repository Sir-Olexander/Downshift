name: text2sql
version: 1-nano-r2
description: 'text2sql-framework: answers a question about a SQL database by exploring the schema with
  execute_sql, testing its query, and returning the final SQL.'
runtime: custom
contract: 'text2sql''s code runs one tool loop: the model calls execute_sql until it replies without a
  tool call.

  The code then extracts the final SQL from that last reply: the SQL must be inside a ```sql code block

  (text outside the block is treated as commentary); without a code block it falls back to the text from
  the

  first SELECT/WITH onwards. The SQL must be read-only (SELECT/WITH). The code runs it itself and its
  rows

  are graded against the task''s correct result, so the final reply must contain exactly one complete
  query.

  The system prompt may use these placeholders, which the code fills in: {dialect}, {dialect_guide},

  {custom_metadata}, {example_tool_note}, {example_list_note}, {instructions}. The step prompt may use
  {question}.'
defaults:
  model: nemotron-3-nano
  temperature: 0.6
  max_tokens: 2000
  reasoning: 'off'
system_prompt: 'You are a SQL expert. Translate natural language questions into SQL queries.


  This is a **{dialect}** database.


  {dialect_guide}

  {custom_metadata}

  ## Tools


  - `execute_sql` -- run read-only SQL (SELECT, WITH, SHOW, DESCRIBE, PRAGMA). Use to explore schema and
  test queries. Use LIMIT to keep results under 100 rows.

  {example_tool_note}

  ## Workflow (follow in order -- do not skip steps)


  1. EXPLORE: Query `information_schema.tables` with ILIKE to find relevant tables. You MUST do this first.

  2. INSPECT: For each candidate table, query `information_schema.columns` to get exact column names and
  types.

  3. RELATIONSHIPS: Query `information_schema.key_column_usage` for foreign keys to find joins.

  4. WRITE & EXECUTE: Write SQL using ONLY names found in steps 1-3. Execute via `execute_sql` to verify.

  5. FIX: If error, read error, fix SQL, re-execute. Repeat until success.

  6. OUTPUT: Return final SQL inside a ```sql code block. No extra text outside the block.


  ## Rules

  1. NEVER guess table or column names -- always look them up first.

  2. Use EXACT names from metadata queries (case-sensitive).

  3. Write {dialect} syntax.

  4. MUST execute final SQL via `execute_sql` before responding.

  5. Final reply MUST contain exactly one ```sql block with the complete query.

  {instructions}'
tools:
  execute_sql:
    description: 'Execute a read-only SQL query and return results.


      Use for: exploring schema metadata (information_schema.tables, information_schema.columns, information_schema.key_column_usage,
      PRAGMA, etc.), testing queries, running final answer.

      Allowed: SELECT, WITH, EXPLAIN, SHOW, DESCRIBE, PRAGMA.

      If error: read error, fix SQL, retry.'
steps:
- id: agent
  kind: tool_loop
  description: Explore schema with execute_sql, write and test query, then reply with final SQL in a ```sql
    block (no tool call).
  prompt: '{question}


    Remember: you MUST query information_schema.tables first to find real table names. Final answer must
    be a single ```sql code block with the complete query.'
  model: nemotron-3-nano
  temperature: 0.6
  max_tokens: 2000
  reasoning: 'off'
  max_tool_calls: 12
  few_shot:
  - input: Find the names of all customers who placed orders in 2023.
    output: '{"tool": "execute_sql", "args": {"sql": "SELECT table_name FROM information_schema.tables
      WHERE table_name ILIKE ''%customer%'' OR table_name ILIKE ''%order%'';"}}

      {"tool": "execute_sql", "args": {"sql": "SELECT column_name, data_type FROM information_schema.columns
      WHERE table_name IN (''customers'', ''orders'');"}}

      {"tool": "execute_sql", "args": {"sql": "SELECT constraint_name, column_name, referenced_table_name,
      referenced_column_name FROM information_schema.key_column_usage WHERE table_name IN (''customers'',
      ''orders'') AND constraint_name ILIKE ''%fk%'';"}}

      {"tool": "execute_sql", "args": {"sql": "SELECT c.name FROM customers c JOIN orders o ON c.id =
      o.customer_id WHERE o.order_date >= ''2023-01-01'' AND o.order_date < ''2024-01-01'';"}}

      ```sql

      SELECT c.name

      FROM customers c

      JOIN orders o ON c.id = o.customer_id

      WHERE o.order_date >= ''2023-01-01'' AND o.order_date < ''2024-01-01'';

      ```'
  - input: What is the average order amount per customer?
    output: '{"tool": "execute_sql", "args": {"sql": "SELECT table_name FROM information_schema.tables
      WHERE table_name ILIKE ''%order%'' OR table_name ILIKE ''%customer%'';"}}

      {"tool": "execute_sql", "args": {"sql": "SELECT column_name, data_type FROM information_schema.columns
      WHERE table_name IN (''customers'', ''orders'');"}}

      {"tool": "execute_sql", "args": {"sql": "SELECT constraint_name, column_name, referenced_table_name,
      referenced_column_name FROM information_schema.key_column_usage WHERE table_name IN (''customers'',
      ''orders'') AND constraint_name ILIKE ''%fk%'';"}}

      {"tool": "execute_sql", "args": {"sql": "SELECT c.id, c.name, AVG(o.amount) AS avg_amount FROM customers
      c JOIN orders o ON c.id = o.customer_id GROUP BY c.id, c.name;"}}

      ```sql

      SELECT c.id, c.name, AVG(o.amount) AS avg_amount

      FROM customers c

      JOIN orders o ON c.id = o.customer_id

      GROUP BY c.id, c.name;

      ```'
  - input: How many museums were opened after 2013 or before 2008?
    output: '{"tool": "execute_sql", "args": {"sql": "SELECT table_name FROM information_schema.tables
      WHERE table_name ILIKE ''%museum%'';"}}

      {"tool": "execute_sql", "args": {"sql": "SELECT column_name, data_type FROM information_schema.columns
      WHERE table_name = ''museums'';"}}

      {"tool": "execute_sql", "args": {"sql": "SELECT COUNT(*) AS museum_count FROM museums WHERE opening_date
      > ''2013-12-31'' OR opening_date < ''2008-01-01'';"}}

      ```sql

      SELECT COUNT(*) AS museum_count

      FROM museums

      WHERE opening_date > ''2013-12-31'' OR opening_date < ''2008-01-01'';

      ```'
  - input: How many countries does each continent have? List the continent id, continent name and the
      number of countries.
    output: '{"tool": "execute_sql", "args": {"sql": "SELECT table_name FROM information_schema.tables
      WHERE table_name ILIKE ''%continent%'' OR table_name ILIKE ''%country%'';"}}

      {"tool": "execute_sql", "args": {"sql": "SELECT column_name, data_type FROM information_schema.columns
      WHERE table_name IN (''continents'', ''countries'');"}}

      {"tool": "execute_sql", "args": {"sql": "SELECT constraint_name, column_name, referenced_table_name,
      referenced_column_name FROM information_schema.key_column_usage WHERE table_name IN (''continents'',
      ''countries'') AND constraint_name ILIKE ''%fk%'';"}}

      {"tool": "execute_sql", "args": {"sql": "SELECT c.continent_id, c.name, COUNT(*) AS country_count
      FROM continents c JOIN countries co ON c.continent_id = co.continent_id GROUP BY c.continent_id,
      c.name;"}}

      ```sql

      SELECT c.continent_id, c.name, COUNT(*) AS country_count

      FROM continents c

      JOIN countries co ON c.continent_id = co.continent_id

      GROUP BY c.continent_id, c.name;

      ```'
  retry_on_fail: false
  enabled: true
changelog:
- 'Strengthened system prompt: made EXPLORE/INSPECT/RELATIONSHIPS steps mandatory with do-not-skip language
  and explicit metadata table names'
- Added two new few-shot examples matching the exact failure patterns (museums, continents/countries)
  showing full explore-inspect-relationships-write-execute workflow
- Increased max_tool_calls from 10 to 12 to accommodate thorough exploration
- Updated step prompt to explicitly remind model to query information_schema.tables first
- Kept reasoning off, temperature 0.6, max_tokens 2000 for cheap reliable mechanical steps
