[project]
name = "downshift-demo-agent"
version = "0.1.0"
description = "Demo research agent: answers questions with web search and cites sources. Behaviour lives in harness.yaml."
requires-python = ">=3.11"
dependencies = [
  "downshift",
  "httpx>=0.27",
  "pyyaml>=6",
  "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_agent"]

[tool.uv.sources]
downshift = { workspace = true }
